name: Lint TypeScript

on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "biome.json"
      - "justfile"
      - ".github/workflows/lint-typescript.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "biome.json"
      - "justfile"
      - ".github/workflows/lint-typescript.yml"
  workflow_dispatch:

jobs:
  lint-and-fmt:
    runs-on: ubuntu-latest
    name: Biome and tsc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install just
        uses: extractions/setup-just@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: just ci-lint-ts
